<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="105mm" viewBox="0 0 100 105" font-family="Consolas, monospace" font-size="3.2">
<rect width="100" height="105" fill="#fff"/>
<text x="4" y="6" fill="#036" font-weight="bold">WallScout D-tekercs 1:1 - egyenes 60 mm, melyseg 50 mm</text>
<text x="4" y="11" fill="#555">Egy tekercs kozepvonala; ket azonos darab kell.</text>

<!-- Kozepvonal: 60 mm egyenes szakasz es 50 x 30 mm-es fel ellipszis -->
<path d="M75 15 V75 A50 30 0 0 1 75 15 Z" fill="#d6e8f8" fill-opacity="0.35" stroke="#c00" stroke-width="0.45"/>

<!-- 3 mm-es pozicionalo furatok a kozepponti vonal menten -->
<g fill="none" stroke="#036" stroke-width="0.3">
  <circle cx="75" cy="15" r="1.5"/><circle cx="75" cy="75" r="1.5"/>
  <circle cx="65" cy="15.6" r="1.5"/><circle cx="65" cy="74.4" r="1.5"/>
  <circle cx="55" cy="17.5" r="1.5"/><circle cx="55" cy="72.5" r="1.5"/>
  <circle cx="45" cy="21" r="1.5"/><circle cx="45" cy="69" r="1.5"/>
  <circle cx="35" cy="27" r="1.5"/><circle cx="35" cy="63" r="1.5"/>
  <circle cx="29" cy="33.2" r="1.5"/><circle cx="29" cy="56.8" r="1.5"/>
  <circle cx="27" cy="36.6" r="1.5"/><circle cx="27" cy="53.4" r="1.5"/>
  <circle cx="25" cy="45" r="1.5"/>
</g>

<line x1="75" y1="12" x2="75" y2="78" stroke="#999" stroke-width="0.2" stroke-dasharray="1.5 1.5"/>
<line x1="22" y1="45" x2="78" y2="45" stroke="#999" stroke-width="0.2" stroke-dasharray="1.5 1.5"/>
<text x="42" y="43" fill="#a40">egyenes oldal 60 mm</text>
<text x="36" y="50" fill="#a40">melyseg 50 mm</text>

<line x1="25" y1="82" x2="75" y2="82" stroke="#036" stroke-width="0.3"/>
<line x1="25" y1="80.5" x2="25" y2="83.5" stroke="#036" stroke-width="0.3"/>
<line x1="75" y1="80.5" x2="75" y2="83.5" stroke="#036" stroke-width="0.3"/>
<text x="42" y="86" fill="#111">50 mm melyseg</text>
<line x1="82" y1="15" x2="82" y2="75" stroke="#036" stroke-width="0.3"/>
<line x1="80.5" y1="15" x2="83.5" y2="15" stroke="#036" stroke-width="0.3"/>
<line x1="80.5" y1="75" x2="83.5" y2="75" stroke="#036" stroke-width="0.3"/>
<text x="86" y="49" fill="#111" transform="rotate(90 86 49)">60 mm egyenes oldal</text>

<text x="4" y="94" fill="#a40">Piros vonal = huzalkoteg kozepvonala; kek korok = 3 mm-es pozicionalo lyukak.</text>
<text x="4" y="99" fill="#a40">Nyomtasd 100%-ban, oldalhoz igazitas nelkul. A vonalzot ellenorizd: 50 mm.</text>
<line x1="43" y1="103" x2="93" y2="103" stroke="#000" stroke-width="0.5"/>
<line x1="43" y1="101.5" x2="43" y2="104.5" stroke="#000" stroke-width="0.5"/>
<line x1="93" y1="101.5" x2="93" y2="104.5" stroke="#000" stroke-width="0.5"/>
</svg>
