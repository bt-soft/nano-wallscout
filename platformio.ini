[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@^2.35.19
build_flags = -O2

; Regi (57600 baudos) bootloaderes Nano / klon
[env:nano]
board = nanoatmega328

; Uj (115200 baudos) bootloaderes Nano
[env:nano_newboot]
board = nanoatmega328new
