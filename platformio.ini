[platformio]
default_envs = nano_newboot

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags = -D AVR8_BREAKPOINT_MODE=1
debug_build_flags =
    -Og
    -g2
lib_deps = olikraus/U8g2@^2.35.19
           jdolinay/avr-debugger@~1.4
debug_tool = avr-stub
debug_port = COM13

; Regi (57600 baudos) bootloaderes Nano / klon
[env:nano]
board = nanoatmega328

; Uj (115200 baudos) bootloaderes Nano
[env:nano_newboot]
board = nanoatmega328new
