<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf3fb"/></linearGradient>
    <linearGradient id="navy" x2="1" y2="0"><stop stop-color="#06436f"/><stop offset="1" stop-color="#0875a8"/></linearGradient>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#d8dadd"/><stop offset="1" stop-color="#aeb5bd"/></linearGradient>
    <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#63d7ff" stop-opacity=".18"/><stop offset="1" stop-color="#008bd2" stop-opacity=".48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17364b" flood-opacity=".16"/></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#12334b}
      .title{font-size:42px;font-weight:700;fill:white}
      .sub{font-size:21px;fill:white}
      .head{font-size:25px;font-weight:700;fill:white}
      .body{font-size:18px}
      .small{font-size:16px}
      .section{font-size:25px;font-weight:700;fill:#06436f}
      .bold{font-weight:700}
      .good{fill:#087b50;font-weight:700}
      .bad{fill:#bd3030;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect x="18" y="16" width="1564" height="112" rx="18" fill="url(#navy)"/>
  <text x="800" y="66" text-anchor="middle" class="title">Fémkereső tekercsek és nyalábjaik – fali betonvas kereséséhez</text>
  <text x="800" y="101" text-anchor="middle" class="sub">A cél a falban futó acélvas helyének pontos kijelölése, minimális falsérüléssel.</text>
  <rect x="20" y="145" width="1560" height="95" rx="14" fill="#d9f0fb" stroke="#acd8ec"/>
  <text x="48" y="181" class="body bold">Fontos:</text>
  <text x="130" y="181" class="body">a tekercs geometriája befolyásolja az érzékelési zóna alakját és a helymeghatározás pontosságát.</text>
  <text x="48" y="213" class="body">A tényleges teljesítményt a tekercs mérete, frekvenciája, a beton vastagsága, a vas mélysége és a készülék elektronikája is meghatározza.</text>

  <!-- Four cards -->
  <g filter="url(#shadow)">
    <rect x="20" y="265" width="375" height="620" rx="16" fill="white" stroke="#1683bd" stroke-width="4"/>
    <rect x="412" y="265" width="375" height="620" rx="16" fill="white" stroke="#13945d" stroke-width="4"/>
    <rect x="804" y="265" width="375" height="620" rx="16" fill="white" stroke="#ed8a16" stroke-width="4"/>
    <rect x="1196" y="265" width="384" height="620" rx="16" fill="white" stroke="#7950a8" stroke-width="4"/>
  </g>
  <rect x="20" y="265" width="375" height="62" rx="12" fill="#087bb6"/><rect x="412" y="265" width="375" height="62" rx="12" fill="#138a58"/>
  <rect x="804" y="265" width="375" height="62" rx="12" fill="#e98212"/><rect x="1196" y="265" width="384" height="62" rx="12" fill="#7046a1"/>
  <text x="207" y="304" text-anchor="middle" class="head">Kör alakú tekercs</text>
  <text x="599" y="304" text-anchor="middle" class="head">DD (Double-D) tekercs</text>
  <text x="991" y="304" text-anchor="middle" class="head">Szonda / pinpointer</text>
  <text x="1388" y="304" text-anchor="middle" class="head">Elliptikus tekercs</text>

  <!-- coil illustrations -->
  <g fill="none" stroke="#1d2b35" stroke-width="17">
    <ellipse cx="207" cy="378" rx="88" ry="34"/><ellipse cx="599" cy="378" rx="88" ry="34"/>
    <ellipse cx="1388" cy="378" rx="104" ry="30"/>
  </g>
  <g stroke="#1d2b35" stroke-width="13" stroke-linecap="round"><path d="M145 351 L91 323"/><path d="M537 351 L483 323"/><path d="M1320 350 L1265 322"/></g>
  <g>
    <rect x="913" y="341" width="160" height="30" rx="15" fill="#202c34" transform="rotate(25 913 341)"/>
    <path d="M919 346 L879 320" stroke="#202c34" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Wall slabs -->
  <g>
    <rect x="45" y="520" width="325" height="115" rx="5" fill="url(#wall)" stroke="#8c969f"/>
    <rect x="437" y="520" width="325" height="115" rx="5" fill="url(#wall)" stroke="#8c969f"/>
    <rect x="829" y="520" width="325" height="115" rx="5" fill="url(#wall)" stroke="#8c969f"/>
    <rect x="1221" y="520" width="334" height="115" rx="5" fill="url(#wall)" stroke="#8c969f"/>
  </g>
  <!-- concrete aggregate -->
  <g fill="#7f8991" opacity=".55">
    <circle cx="73" cy="548" r="3"/><circle cx="112" cy="612" r="4"/><circle cx="180" cy="542" r="3"/><circle cx="330" cy="601" r="4"/><circle cx="286" cy="548" r="3"/>
    <circle cx="465" cy="550" r="3"/><circle cx="529" cy="612" r="4"/><circle cx="689" cy="548" r="3"/><circle cx="740" cy="600" r="4"/>
    <circle cx="854" cy="548" r="3"/><circle cx="914" cy="611" r="4"/><circle cx="1082" cy="550" r="3"/><circle cx="1130" cy="600" r="4"/>
    <circle cx="1247" cy="548" r="3"/><circle cx="1309" cy="611" r="4"/><circle cx="1475" cy="550" r="3"/><circle cx="1528" cy="600" r="4"/>
  </g>
  <!-- rebar -->
  <g stroke="#79502d" stroke-width="12"><path d="M142 520 V635"/><path d="M271 520 V635"/><path d="M523 520 V635"/><path d="M680 520 V635"/><path d="M909 520 V635"/><path d="M1067 520 V635"/><path d="M1302 520 V635"/><path d="M1472 520 V635"/></g>
  <g stroke="#d8a36b" stroke-width="3"><path d="M136 535 l12 7 M136 558 l12 7 M136 581 l12 7 M136 604 l12 7 M517 535 l12 7 M517 558 l12 7 M517 581 l12 7 M517 604 l12 7 M903 535 l12 7 M903 558 l12 7 M903 581 l12 7 M903 604 l12 7 M1296 535 l12 7 M1296 558 l12 7 M1296 581 l12 7 M1296 604 l12 7"/></g>
  <!-- beams: concentric broad; DD narrow; probe narrow; elliptical -->
  <path d="M95 420 Q207 390 319 420 L286 520 Q207 545 128 520 Z" fill="url(#blue)" stroke="#159bd4" stroke-width="2"/>
  <path d="M489 420 Q599 390 709 420 L657 520 Q599 535 541 520 Z" fill="url(#blue)" stroke="#159bd4" stroke-width="2"/>
  <path d="M953 408 Q991 390 1029 408 L1011 520 Q991 535 971 520 Z" fill="url(#blue)" stroke="#159bd4" stroke-width="2"/>
  <path d="M1264 420 Q1388 390 1512 420 L1460 520 Q1388 540 1316 520 Z" fill="url(#blue)" stroke="#159bd4" stroke-width="2"/>
  <!-- captions -->
  <text x="207" y="665" text-anchor="middle" class="body bold">Széles, kúpos érzékelési zóna</text>
  <text x="599" y="665" text-anchor="middle" class="body bold">Keskenyebb, jól fókuszált zóna</text>
  <text x="991" y="665" text-anchor="middle" class="body bold">Nagyon lokális érzékelés</text>
  <text x="1388" y="665" text-anchor="middle" class="body bold">Ovális, irányított zóna</text>

  <!-- card descriptions -->
  <g class="body">
    <text x="43" y="704" class="good">ELŐNYÖK</text>
    <text x="43" y="733">• Nagyobb lefedett terület</text><text x="43" y="760">• Gyors előzetes átvizsgálás</text>
    <text x="43" y="799" class="bad">HÁTRÁNYOK</text>
    <text x="43" y="828">• Szélesebb jel, pontatlanabb</text><text x="43" y="853">  középvonal-meghatározás</text>

    <text x="435" y="704" class="good">ELŐNYÖK</text>
    <text x="435" y="733">• Jó vonalkövetés és lokalizálás</text><text x="435" y="760">• Keskenyebb érzékelési sáv</text>
    <text x="435" y="799" class="bad">HÁTRÁNYOK</text>
    <text x="435" y="828">• A mélység készülékfüggő</text><text x="435" y="853">• Keresztirányú pásztázás kell</text>

    <text x="827" y="704" class="good">ELŐNYÖK</text>
    <text x="827" y="733">• Pontos lokális ellenőrzés</text><text x="827" y="760">• Szűk helyeken is használható</text>
    <text x="827" y="799" class="bad">HÁTRÁNYOK</text>
    <text x="827" y="828">• Nem hatékony nagy falfelületre</text><text x="827" y="853">• Korlátozott mélység</text>

    <text x="1219" y="704" class="good">ELŐNYÖK</text>
    <text x="1219" y="733">• Jó kompromisszumos lefedés</text><text x="1219" y="760">• Irányított pásztázás</text>
    <text x="1219" y="799" class="bad">HÁTRÁNYOK</text>
    <text x="1219" y="828">• Pontossága típustól függ</text><text x="1219" y="853">• Nem feltétlen jobb a DD-nél</text>
  </g>

  <!-- recommendation footer -->
  <rect x="20" y="910" width="1560" height="250" rx="18" fill="#e1f5eb" stroke="#15945c" stroke-width="4"/>
  <text x="55" y="958" class="section" fill="#087b50">AJÁNLÁS: DD TEKERC S – jó kiindulópont betonvasak vonalának feltérképezéséhez</text>
  <text x="60" y="1005" class="body">A két egymásba fordított D tekercs jellemzően keskenyebb, jól követhető érzékelési sávot ad, ezért alkalmas lehet</text>
  <text x="60" y="1034" class="body">a betonvasak nyomvonalának és középvonalának kijelölésére. A pontosságot mindig a konkrét detektor és tekercs adatai döntik el.</text>
  <rect x="55" y="1060" width="1490" height="72" rx="12" fill="#fff4d8" stroke="#e4b84b"/>
  <text x="80" y="1090" class="body bold">Gyakorlati módszer:</text>
  <text x="270" y="1090" class="body">lassú, párhuzamos pásztázás két egymásra merőleges irányban; jelmaximumok alapján jelöld a vas tengelyét.</text>
  <text x="80" y="1118" class="small">Megjegyzés: a hagyományos fémdetektor nem feltétlenül különbözteti meg a betonvasat más fémtárgyaktól; vezetékek és csövek miatt használj megfelelő falkeresőt is.</text>
</svg>