<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" font-family="Consolas, monospace" font-size="12">
<rect width="1320" height="780" fill="#fff"/>
<defs>
 <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
 <g id="rv" stroke="#222" stroke-width="1.6" fill="none">
  <line x1="0" y1="0" x2="0" y2="10"/><rect x="-7" y="10" width="14" height="30" fill="#fff"/><line x1="0" y1="40" x2="0" y2="50"/>
 </g>
 <g id="rh" stroke="#222" stroke-width="1.6" fill="none">
  <line x1="0" y1="0" x2="10" y2="0"/><rect x="10" y="-7" width="30" height="14" fill="#fff"/><line x1="40" y1="0" x2="50" y2="0"/>
 </g>
 <g id="ch" stroke="#222" stroke-width="1.6" fill="none">
  <line x1="0" y1="0" x2="8" y2="0"/><line x1="8" y1="-10" x2="8" y2="10"/><line x1="12" y1="-10" x2="12" y2="10"/><line x1="12" y1="0" x2="20" y2="0"/>
 </g>
 <g id="cv" stroke="#222" stroke-width="1.6" fill="none">
  <line x1="0" y1="0" x2="0" y2="8"/><line x1="-10" y1="8" x2="10" y2="8"/><line x1="-10" y1="12" x2="10" y2="12"/><line x1="0" y1="12" x2="0" y2="20"/>
 </g>
 <g id="gnd" stroke="#222" stroke-width="1.6" fill="none">
  <line x1="0" y1="0" x2="0" y2="6"/><line x1="-10" y1="6" x2="10" y2="6"/><line x1="-6" y1="10" x2="6" y2="10"/><line x1="-2" y1="14" x2="2" y2="14"/>
 </g>
 <!-- Egy neminvertalo erosito fokozat; helyi origo = a + bemenet csomopontja (N1) -->
 <g id="stage" stroke="#222" stroke-width="1.6" fill="none">
  <use href="#rv" x="0" y="0"/>
  <line x1="-8" y1="50" x2="8" y2="50"/>
  <text x="-14" y="66" stroke="none" fill="#a40" font-size="11">VREF</text>
  <circle cx="0" cy="0" r="3" fill="#222"/>
  <path d="M0 0 H24 A6 6 0 0 1 36 0 H50"/>
  <polygon points="50,-53 50,17 130,-18" fill="#fff"/>
  <text x="54" y="-31" stroke="none" fill="#111" font-size="14">-</text>
  <text x="54" y="5" stroke="none" fill="#111" font-size="14">+</text>
  <line x1="30" y1="-36" x2="50" y2="-36"/>
  <circle cx="30" cy="-36" r="3" fill="#222"/>
  <line x1="30" y1="-36" x2="30" y2="22"/>
  <use href="#rv" x="30" y="22"/>
  <use href="#cv" x="30" y="72"/>
  <line x1="30" y1="92" x2="30" y2="104"/>
  <use href="#gnd" x="30" y="104"/>
  <text x="38" y="86" stroke="none" fill="#111" font-size="11">+</text>
  <line x1="130" y1="-18" x2="150" y2="-18"/>
  <circle cx="150" cy="-18" r="3" fill="#222"/>
  <line x1="150" y1="-18" x2="150" y2="-90"/>
  <line x1="150" y1="-90" x2="120" y2="-90"/>
  <use href="#rh" x="70" y="-90"/>
  <line x1="70" y1="-90" x2="30" y2="-90"/>
  <line x1="30" y1="-90" x2="30" y2="-36"/>
  <circle cx="70" cy="-90" r="3" fill="#222"/>
  <circle cx="120" cy="-90" r="3" fill="#222"/>
  <line x1="70" y1="-90" x2="70" y2="-115"/>
  <line x1="70" y1="-115" x2="85" y2="-115"/>
  <use href="#ch" x="85" y="-115"/>
  <line x1="105" y1="-115" x2="120" y2="-115"/>
  <line x1="120" y1="-115" x2="120" y2="-90"/>
 </g>
</defs>
<style>
 .t{fill:#111}.h{font-size:16px;font-weight:bold;fill:#036}.n{fill:#a40;font-size:12px}
 .w{stroke:#222;stroke-width:1.6;fill:none}.cu{stroke:#b5651d;stroke-width:2.2;fill:none}
 .s{font-size:10px;fill:#036}
</style>

<text x="20" y="28" class="h">WallScout - analog kapcsolas reszletesen: VREF, RX erosito (IC2A, IC2B), 50 Hz antenna (IC2C)</text>
<text x="20" y="46" class="n">Pont = osszekotes; ive a vezetekben (hop) = keresztezes, nincs osszekotes. Minden fok. a Nano +5V_A sinjerol megy.</text>

<!-- ===================== 1) TAP + VREF ===================== -->
<text x="20" y="62" class="h">1) +5V_A szuro es VREF elo (kb. 2,5 V) pufferrel</text>
<text x="14" y="84" class="t">Nano 5V</text>
<line x1="70" y1="80" x2="110" y2="80" class="w"/>
<use href="#rh" x="110" y="80"/>
<text x="118" y="104" class="t">100R</text>
<line x1="160" y1="80" x2="640" y2="80" class="w"/>
<circle cx="200" cy="80" r="3" fill="#222"/>
<line x1="200" y1="80" x2="200" y2="100" class="w"/>
<use href="#cv" x="200" y="100"/>
<line x1="200" y1="120" x2="200" y2="140" class="w"/>
<use href="#gnd" x="200" y="140"/>
<text x="212" y="116" class="t">100uF</text><text x="206" y="100" class="s">+</text>
<text x="570" y="72" class="n">+5V_A</text>

<circle cx="300" cy="80" r="3" fill="#222"/>
<use href="#rv" x="300" y="80"/>
<use href="#rv" x="300" y="130"/>
<line x1="300" y1="180" x2="300" y2="182" class="w"/>
<use href="#gnd" x="300" y="180"/>
<text x="288" y="110" class="t" text-anchor="end">R1 100k</text>
<text x="288" y="162" class="t" text-anchor="end">R2 100k</text>
<circle cx="300" cy="130" r="3" fill="#222"/>
<line x1="300" y1="130" x2="380" y2="130" class="w"/>
<circle cx="350" cy="130" r="3" fill="#222"/>
<line x1="350" y1="130" x2="350" y2="150" class="w"/>
<use href="#cv" x="350" y="150"/>
<line x1="350" y1="170" x2="350" y2="184" class="w"/>
<use href="#gnd" x="350" y="184"/>
<text x="334" y="140" class="s">+</text>
<text x="362" y="166" class="t">10uF</text>
<line x1="380" y1="130" x2="380" y2="215" class="w"/>
<line x1="380" y1="215" x2="420" y2="215" class="w"/>

<polygon points="420,162 420,232 500,197" class="c" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="424" y="184" class="t" font-size="14">-</text><text x="424" y="220" class="t" font-size="14">+</text>
<text x="406" y="175" class="s">13</text><text x="406" y="211" class="s">12</text><text x="504" y="193" class="s">14</text>
<text x="428" y="156" class="t">IC2D MCP6004</text>
<line x1="500" y1="197" x2="520" y2="197" class="w"/>
<circle cx="520" cy="197" r="3" fill="#222"/>
<line x1="520" y1="197" x2="520" y2="150" class="w"/>
<line x1="520" y1="150" x2="400" y2="150" class="w"/>
<line x1="400" y1="150" x2="400" y2="179" class="w"/>
<line x1="400" y1="179" x2="420" y2="179" class="w"/>
<line x1="520" y1="197" x2="600" y2="197" class="w"/>
<text x="606" y="201" class="n">VREF ~ 2,5 V</text>
<text x="446" y="248" class="t">feszultsegkovet</text>

<text x="660" y="100" class="t">IC2: MCP6004 (negyes, rail-to-rail, DIP-14): A, B = RX, C = antenna, D = VREF.</text>
<text x="660" y="116" class="t">Tap: pin 4 = +5V_A, pin 11 = GND, 100nF a lab kozott.</text>
<text x="660" y="138" class="n">A puffer (IC2D) kimenetere max. ~100 pF tehet, ezert a 10uF</text>
<text x="660" y="154" class="n">a puffer BEMENETEN (az osztonal) van, nem a kimeneten.</text>
<text x="660" y="176" class="n">A puffer kis impedanciaju VREF-et ad az RX-lanc es az antenna</text>
<text x="660" y="192" class="n">elofeszito ellenallasainak, ez csokkenti az atkapcsolodast.</text>

<!-- ===================== 2) RX LANC ===================== -->
<text x="20" y="288" class="h">2) RX lanc: rezgokor -> IC2A (x11) -> IC2B (x1...x11) -> RC szuro -> A0</text>

<!-- L_RX -->
<text x="20" y="470" class="t">L_RX</text><text x="20" y="486" class="n">~1 mH D-tekercs,</text><text x="20" y="500" class="n">60 menet</text>
<line x1="130" y1="430" x2="130" y2="440" class="w"/>
<path d="M130 440 q12 8 0 16 q12 8 0 16 q12 8 0 16 q12 8 0 16" class="cu"/>
<line x1="130" y1="504" x2="130" y2="516" class="w"/>
<use href="#gnd" x="130" y="516"/>
<circle cx="130" cy="430" r="3" fill="#222"/>
<line x1="130" y1="430" x2="240" y2="430" class="w"/>
<text x="136" y="420" class="n">X</text>
<circle cx="185" cy="430" r="3" fill="#222"/>
<line x1="185" y1="430" x2="185" y2="450" class="w"/>
<use href="#cv" x="185" y="450"/>
<line x1="185" y1="470" x2="185" y2="516" class="w"/>
<use href="#gnd" x="185" y="516"/>
<text x="196" y="466" class="t">CRX 1uF</text><text x="196" y="480" class="n">folia (MKP)</text>

<use href="#ch" x="240" y="430"/>
<line x1="260" y1="430" x2="280" y2="430" class="w"/>
<use href="#rh" x="280" y="430"/>
<text x="230" y="414" class="t">C3 1uF</text>
<text x="282" y="414" class="t">R3 4,7k</text>
<text x="256" y="402" class="n">bemeneti vedelem</text>

<!-- Stage 1 -->
<g transform="translate(330,430)">
 <use href="#stage"/>
 <text x="56" y="-62" class="t">IC2A MCP6004</text>
 <text x="38" y="-40" class="s">2</text><text x="38" y="-4" class="s">3</text><text x="134" y="-22" class="s">1</text>
 <text x="76" y="-72" class="t">Rf1 10k</text>
 <text x="72" y="-128" class="t">Cf1 47pF</text>
 <text x="-12" y="30" class="t" text-anchor="end">R4 100k</text>
 <text x="38" y="52" class="t">Rg1 1k</text>
 <text x="38" y="100" class="t">Cg1 100uF</text>
 <text x="66" y="38" class="n">A = 1+10k/1k = 11</text>
</g>
<text x="330" y="548" class="n">(az Rg-hez soros 100uF</text><text x="330" y="562" class="n">miatt DC-ben A=1, a kimenet VREF)</text>

<!-- C4 + R5 -->
<line x1="480" y1="412" x2="500" y2="412" class="w"/>
<use href="#ch" x="500" y="412"/>
<line x1="520" y1="412" x2="540" y2="412" class="w"/>
<use href="#rh" x="540" y="412"/>
<line x1="590" y1="412" x2="610" y2="412" class="w"/>
<text x="496" y="396" class="t">C4 1uF</text>
<text x="542" y="396" class="t">R5 4,7k</text>

<!-- Stage 2 -->
<g transform="translate(610,412)">
 <use href="#stage"/>
 <line x1="78" y1="-82" x2="114" y2="-98" stroke="#222" stroke-width="1.4" marker-end="url(#ar)"/>
 <text x="56" y="-62" class="t">IC2B MCP6004</text>
 <text x="38" y="-40" class="s">6</text><text x="38" y="-4" class="s">5</text><text x="134" y="-22" class="s">7</text>
 <text x="70" y="-72" class="t">Rf2 trimmer 10k (GAIN)</text>
 <text x="72" y="-128" class="t">Cf2 47pF</text>
 <text x="-12" y="30" class="t" text-anchor="end">R6 100k</text>
 <text x="38" y="52" class="t">Rg2 1k</text>
 <text x="38" y="100" class="t">Cg2 100uF</text>
 <text x="66" y="38" class="n">A = 1+Rf2/1k = 1...11</text>
</g>

<!-- kimeneti RC -->
<line x1="760" y1="394" x2="790" y2="394" class="w"/>
<use href="#rh" x="790" y="394"/>
<text x="800" y="384" class="t">R7 1k</text>
<line x1="840" y1="394" x2="880" y2="394" class="w"/>
<circle cx="880" cy="394" r="3" fill="#222"/>
<line x1="880" y1="394" x2="880" y2="420" class="w"/>
<use href="#cv" x="880" y="420"/>
<line x1="880" y1="440" x2="880" y2="470" class="w"/>
<use href="#gnd" x="880" y="470"/>
<text x="892" y="436" class="t">C5 10nF</text>
<line x1="880" y1="394" x2="940" y2="394" class="w" marker-end="url(#ar)"/>
<text x="946" y="398" class="t">A0 (Nano)</text>

<!-- ===================== 3) AC ANTENNA ===================== -->
<text x="20" y="590" class="h">3) 50 Hz antenna puffer (elo vezetek)</text>
<rect x="40" y="640" width="50" height="40" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="46" y="664" class="t">ANT</text>
<text x="22" y="698" class="n">5x5 cm rezlap</text>
<line x1="90" y1="660" x2="200" y2="660" class="w"/>
<circle cx="150" cy="660" r="3" fill="#222"/>
<use href="#rv" x="150" y="660"/>
<line x1="142" y1="710" x2="158" y2="710" class="w"/>
<text x="136" y="726" class="n">VREF</text>
<text x="162" y="690" class="t">R8 10M</text>

<polygon points="200,607 200,677 280,642" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="204" y="629" class="t" font-size="14">-</text><text x="204" y="665" class="t" font-size="14">+</text>
<text x="186" y="620" class="s">9</text><text x="186" y="656" class="s">10</text><text x="284" y="638" class="s">8</text>
<text x="206" y="696" class="t">IC2C MCP6004</text>
<text x="206" y="710" class="n">feszultsegkovet</text>
<line x1="280" y1="642" x2="300" y2="642" class="w"/>
<circle cx="300" cy="642" r="3" fill="#222"/>
<line x1="300" y1="642" x2="300" y2="590" class="w"/>
<line x1="300" y1="590" x2="180" y2="590" class="w"/>
<line x1="180" y1="590" x2="180" y2="624" class="w"/>
<line x1="180" y1="624" x2="200" y2="624" class="w"/>
<line x1="300" y1="642" x2="330" y2="642" class="w"/>
<use href="#rh" x="330" y="642"/>
<text x="340" y="632" class="t">R9 100R</text>
<line x1="380" y1="642" x2="470" y2="642" class="w" marker-end="url(#ar)"/>
<circle cx="410" cy="642" r="3" fill="#222"/>
<line x1="410" y1="642" x2="410" y2="664" class="w"/>
<use href="#cv" x="410" y="664"/>
<line x1="410" y1="684" x2="410" y2="700" class="w"/>
<use href="#gnd" x="410" y="700"/>
<text x="422" y="680" class="t">C6 100nF</text>
<text x="476" y="646" class="t">A1 (Nano)</text>
<text x="40" y="750" class="n">Az antennakabel arnyekolt, az arnyekolas GND-n. Az A1 csatornan csak a valtakozo osszetevo szamit (RMS), a DC szint (VREF) kiesik.</text>

<!-- ===================== SZAMOLT ERTEKEK ===================== -->
<rect x="1000" y="300" width="300" height="410" fill="#eef6ff" stroke="#036" stroke-width="1.6"/>
<text x="1012" y="324" class="h">Szamolt ertekek</text>
<text x="1012" y="348" class="t">RX rezgokor:</text>
<text x="1012" y="364" class="n"> L~1 mH, CRX=1uF -&gt; f0 ~ 5,0 kHz</text>
<text x="1012" y="388" class="t">Erosites:</text>
<text x="1012" y="404" class="n"> IC2A: 1+10k/1k = x11</text>
<text x="1012" y="420" class="n"> IC2B: 1+Rf2/1k = x1...x11</text>
<text x="1012" y="436" class="n"> osszesen: x11 ... x121</text>
<text x="1012" y="460" class="t">Also torespont (~1,6 Hz):</text>
<text x="1012" y="476" class="n"> C3 / R4(100k), C4 / R6(100k)</text>
<text x="1012" y="492" class="n"> Rg 1k * Cg 100uF</text>
<text x="1012" y="516" class="t">Kimeneti RC (R7, C5):</text>
<text x="1012" y="532" class="n"> fc = 1/(2*pi*1k*10nF) ~ 16 kHz</text>
<text x="1012" y="548" class="n"> TX-en (4,5 kHz): -0,3 dB, ~16 fok</text>
<text x="1012" y="564" class="n"> fazis (a vas-betanitas kompenzalja)</text>
<text x="1012" y="588" class="t">DC munkapont:</text>
<text x="1012" y="604" class="n"> minden fokozat kimenete = VREF</text>
<text x="1012" y="620" class="n"> (DC erosites x1)</text>
<text x="1012" y="644" class="t">Elrendezes:</text>
<text x="1012" y="660" class="n"> RX lanc a TX-tol tavol, rovid</text>
<text x="1012" y="676" class="n"> vezetekekkel, GND csillagpont,</text>
<text x="1012" y="692" class="n"> arnyekolt kabel az L_RX-hez.</text>
</svg>
